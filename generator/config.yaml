# Параметры симуляции пассажиропотока Московского метро.
# Режим: при старте — backfill за `backfill_hours` часов до текущего момента,
# затем генерация и отправка в Kafka каждую реальную секунду (1:1 с wall-clock).

events_per_day: 1500000      # ПОСАДОК (trip'ов) за сутки; каждое событие входа = событие выхода
backfill_hours: 72           # история при старте: 3 суток (0 = выключить)

ride_step_min: 2.2           # ход между соседними станциями
turnback_min: 6.0            # оборот на конечных (радиальные линии)

# Профиль суток: доля суточного объёма по часам (0-23)
hourly_profile:
  - 0.06   # 00
  - 0.04   # 01
  - 0.03   # 02
  - 0.03   # 03
  - 0.04   # 04
  - 0.12   # 05
  - 0.55   # 06
  - 1.25   # 07
  - 1.55   # 08
  - 1.20   # 09
  - 0.85   # 10
  - 0.78   # 11
  - 0.78   # 12
  - 0.82   # 13
  - 0.90   # 14
  - 1.10   # 15
  - 1.35   # 16
  - 1.50   # 17
  - 1.25   # 18
  - 0.85   # 19
  - 0.60   # 20
  - 0.45   # 21
  - 0.30   # 22
  - 0.15   # 23

# Парки поездов по линиям (плоская модель: вагон + вместимость).
# train_id = line_id * 10000 + номер состава.
lines:
  1:  {model: "81-765",        num_cars: 8, seated_per_car: 156, total_per_car: 264, headway_min: 4.0}
  2:  {model: "81-765/777",    num_cars: 8, seated_per_car: 156, total_per_car: 264, headway_min: 4.0}
  3:  {model: "81-765",        num_cars: 8, seated_per_car: 156, total_per_car: 264, headway_min: 4.5}
  5:  {model: "81-540.2",      num_cars: 6, seated_per_car: 108, total_per_car: 220, headway_min: 4.0}
  10: {model: "81-740/741/742", num_cars: 8, seated_per_car: 160, total_per_car: 240, headway_min: 5.0}

stations_csv: /data/stations.csv
center: {lat: 55.7520, lon: 37.6180}   # для весов станций: центр ближе -> оживлённее
